name: Sync Upstream

on:
  schedule:
    # Run daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Auto-merge the PR if tests pass (no manual review)"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      workflows: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/p2r3/convert.git

      - name: Fetch upstream master
        run: git fetch upstream master

      - name: Check how many commits behind
        id: check
        run: |
          BEHIND=$(git log HEAD..upstream/master --oneline | wc -l | tr -d ' ')
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commit(s) ahead of this fork."

      - name: Skip if already up to date
        if: steps.check.outputs.behind == '0'
        run: echo "Already up to date. Nothing to do."

      - name: Collect upstream change summary
        if: steps.check.outputs.behind != '0'
        id: summary
        run: |
          SUMMARY=$(git log HEAD..upstream/master --oneline | head -30)
          # Store as multiline output
          {
            echo "summary<<SUMMARY_EOF"
            echo "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        id: branch
        run: |
          BRANCH="upstream-sync/$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"

          # Attempt a clean merge; if conflicts arise, use ours strategy
          # so the fork's customisations (UI, extra handlers) are preserved.
          if ! git merge upstream/master --no-edit --strategy-option=ours 2>/dev/null; then
            echo "Merge conflict – applying upstream with ours strategy for conflicts."
            git merge --abort 2>/dev/null || true
            git merge upstream/master --no-edit -X ours
          fi

          # Always restore our own .github/workflows/ after the merge.
          # This prevents upstream's new/changed workflow files from being
          # included in the sync branch, which would cause the push to fail
          # with "refusing to allow a GitHub App to update workflow files".
          git checkout master -- .github/workflows/ 2>/dev/null || true
          git diff --cached --quiet || git commit --amend --no-edit

          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          BEHIND="${{ steps.check.outputs.behind }}"
          SUMMARY="${{ steps.summary.outputs.summary }}"

          BODY="## Upstream sync — $BEHIND new commit(s) from [p2r3/convert](https://github.com/p2r3/convert)

          ### What changed upstream:
          \`\`\`
          ${SUMMARY}
          \`\`\`

          ### What this PR does:
          - Brings in the upstream changes using \`-X ours\` merge strategy so **your fork's custom UI and handlers are always kept**.
          - Any conflicts were automatically resolved in favour of your fork's version.

          ### How to handle this:
          - **Review** the diff and merge if the upstream changes look good.
          - To **auto-accept future PRs**, go to *Settings → Actions → sync-upstream* and re-run with \`auto_merge: true\`, or set up a branch protection auto-merge rule.
          - If you want to **reject this sync**, simply close the PR.

          ---
          *Auto-generated by the [Sync Upstream](.github/workflows/sync-upstream.yml) workflow.*"

          gh pr create \
            --title "Upstream sync $(date +%Y-%m-%d): $BEHIND new commit(s)" \
            --body "$BODY" \
            --head "$BRANCH" \
            --base master \
            --label "upstream-sync" \
          || echo "PR may already exist for this branch."

      - name: Enable auto-merge (if requested)
        if: >
          steps.check.outputs.behind != '0' &&
          inputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Give the PR a moment to be created before enabling auto-merge
          sleep 5
          BRANCH="${{ steps.branch.outputs.branch }}"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --auto --merge
            echo "Auto-merge enabled for PR #$PR_NUMBER"
          else
            echo "Could not find PR number to enable auto-merge."
          fi
